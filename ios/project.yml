name: Moments
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MomentCore:
    path: MomentCore
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  Moments:
    type: application
    platform: iOS
    sources: [Moments, Shared]
    dependencies:
      - package: MomentCore
      - target: MomentsWidget
    info:
      path: Moments/Info.plist
      properties:
        CFBundleDisplayName: Moments
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Moments uses your location to notice sunsets, rain, long stops and the drive home, so it can pick the right song.
        NSLocationAlwaysAndWhenInUseUsageDescription: Moments detects drives in the background so it can pick songs for moments on the road. Your route stays on your phone. Weather uses a rounded location, and only a short summary like "sunset, leaving a national park" is sent to pick a song.
        NSMotionUsageDescription: Moments uses motion activity to tell when you start and stop driving.
        CFBundleURLTypes:
          - CFBundleURLName: spotify-callback
            CFBundleURLSchemes: [moments]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        BackendURL: $(BACKEND_URL)
        BackendToken: $(BACKEND_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MomentsWidget:
    type: app-extension
    platform: iOS
    sources: [MomentsWidget, Shared]
    info:
      path: MomentsWidget/Info.plist
      properties:
        CFBundleDisplayName: Moments
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.widget
        TARGETED_DEVICE_FAMILY: "1"
